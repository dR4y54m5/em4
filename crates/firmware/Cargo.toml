[package]
name = "firmware"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "firmware"
path = "src/main.rs"
test = false
bench = false

[dependencies]
machine-core = { path = "../machine-core" }
enigma = { path = "../enigma" }

esp-hal = { version = "1.2", features = ["esp32c3", "unstable"] }
esp-alloc = { version = "0.11", features = ["esp32c3"] }
esp-backtrace = { version = "0.17", features = ["esp32c3", "panic-handler", "println"] }
esp-println = { version = "0.15", features = ["esp32c3"] }

ssd1306 = "0.10"
embedded-graphics = "0.8"

[profile.dev]
opt-level = "s"
lto = false

[profile.release]
opt-level = "s"
lto = true
